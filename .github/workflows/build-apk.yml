name: Build APK

on:
  push:
    branches:
      - arena/955e01ad-htmleditorapk
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Сборка debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Publish build errors to issue #1
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "### Ошибка сборки — \`${{ github.sha }}\` ($(date -u +%FT%TZ))"
            echo '```'
            grep -E "^e: |error:|What went wrong|Execution failed|Caused by|FAILED" build.log | head -100
            echo '--- tail ---'
            tail -n 40 build.log
            echo '```'
          } > body.md
          echo "body.md bytes: $(wc -c < body.md)"
          gh issue comment 1 --repo "${{ github.repository }}" --body-file body.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: HtmlEditor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
